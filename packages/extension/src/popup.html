<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Deeporax Browser MCP</title>
    <style>
      /*
        Field-report panel, not a card stack.
        Tokens from deeporax.com. System fonts only (extension CSP).
        Contrast target: body text ≥ 4.5:1, UI chrome ≥ 3:1.
      */
      :root {
        color-scheme: light dark;

        --ink: #15170f;
        --ink-2: #3a3e2c;
        --ink-3: #565b43;
        --paper: #fdfcf7;
        --paper-bg: #f6f4ea;
        --paper-2: #efecdd;
        --acid: #b6e51f;
        --acid-hover: #c9ef4a;
        --acid-ink: #2b3505;
        --live: #3f7d3a;
        --live-bg: #e0efdb;
        --warn: #8a5500;
        --warn-bg: #f6e9cc;
        --off: #565b43;
        --off-bg: #e9eadf;
        --line: rgba(21, 23, 15, 0.16);
        --focus: 0 0 0 2px var(--paper), 0 0 0 4px var(--ink);
        --block: 2px 2px 0 rgba(21, 23, 15, 0.9);
        --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
          sans-serif;
        --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        --ease: cubic-bezier(0.22, 1, 0.36, 1);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --ink: #f2f1e4;
          --ink-2: #c3c4ac;
          --ink-3: #9fa287;
          --paper: #191c10;
          --paper-bg: #121408;
          --paper-2: #212416;
          --live: #84cd74;
          --live-bg: #20301b;
          --warn: #e3a83f;
          --warn-bg: #382c12;
          --off: #9fa287;
          --off-bg: #282b19;
          --line: rgba(242, 241, 228, 0.16);
          --focus: 0 0 0 2px var(--paper-bg), 0 0 0 4px var(--acid);
          --block: 2px 2px 0 rgba(0, 0, 0, 0.92);
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        width: 300px;
        margin: 0;
        background: var(--paper-bg);
        color: var(--ink);
        font: 400 13px/1.45 var(--sans);
        -webkit-font-smoothing: antialiased;
      }

      /* ---- identity strip ---- */
      .id {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 12px;
        background: var(--paper);
        border-bottom: 1px solid var(--line);
      }

      .id-btn {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        min-width: 0;
        margin: 0;
        padding: 2px;
        border: 0;
        border-radius: 6px;
        background: none;
        color: inherit;
        font: inherit;
        cursor: pointer;
      }
      .id-btn:focus-visible {
        box-shadow: var(--focus);
        outline: none;
      }
      .id-btn svg {
        display: block;
        flex: none;
      }

      .id-name {
        font-size: 13px;
        font-weight: 700;
        letter-spacing: -0.03em;
      }

      .id-product {
        margin-left: auto;
        color: var(--ink-3);
        font-family: var(--mono);
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      /* ---- status is the panel, not a nested card ---- */
      .status {
        padding: 14px 12px 12px;
        border-bottom: 1px solid var(--line);
        background: var(--off-bg);
      }
      [data-state="connected"] .status {
        background: var(--live-bg);
      }
      [data-state="connecting"] .status {
        background: var(--warn-bg);
      }

      .status-kicker {
        margin: 0 0 4px;
        font-family: var(--mono);
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--ink-3);
      }
      [data-state="connected"] .status-kicker {
        color: var(--live);
      }
      [data-state="connecting"] .status-kicker {
        color: var(--warn);
      }

      .status-title {
        margin: 0;
        font-size: 20px;
        font-weight: 750;
        letter-spacing: -0.04em;
        line-height: 1.1;
        color: var(--ink);
      }

      .status-detail {
        margin: 6px 0 0;
        font-size: 12.5px;
        line-height: 1.4;
        color: var(--ink-2);
      }

      .endpoint {
        font-family: var(--mono);
        font-size: 11.5px;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
        letter-spacing: -0.01em;
        color: var(--ink);
        word-break: break-all;
      }

      .hint {
        margin: 10px 0 0;
        font-size: 12px;
        line-height: 1.4;
        color: var(--ink-2);
      }
      .hint code {
        font-family: var(--mono);
        font-size: 11px;
        font-weight: 600;
        color: var(--ink);
      }

      /* ---- controls ---- */
      .controls {
        display: grid;
        gap: 0;
        padding: 0;
        background: var(--paper);
      }

      .row {
        display: flex;
        align-items: center;
        gap: 12px;
        width: 100%;
        margin: 0;
        padding: 12px;
        border: 0;
        border-bottom: 1px solid var(--line);
        background: transparent;
        text-align: left;
        cursor: pointer;
      }
      .row:focus-within {
        background: var(--paper-2);
      }

      .row-copy {
        flex: 1;
        min-width: 0;
      }
      .row-title {
        display: block;
        font-size: 13px;
        font-weight: 650;
        letter-spacing: -0.015em;
        color: var(--ink);
      }
      .row-hint {
        display: block;
        margin-top: 2px;
        font-size: 11.5px;
        line-height: 1.35;
        color: var(--ink-3);
      }

      /* Brand toggle: ink thumb on paper / acid track */
      .switch {
        position: relative;
        flex: none;
        width: 38px;
        height: 22px;
      }
      .switch input {
        position: absolute;
        inset: 0;
        z-index: 1;
        margin: 0;
        opacity: 0;
        cursor: pointer;
      }
      .switch-ui {
        display: block;
        width: 100%;
        height: 100%;
        border: 1.5px solid var(--ink);
        border-radius: 999px;
        background: var(--paper-2);
        transition: background 120ms var(--ease);
        pointer-events: none;
      }
      .switch-ui::after {
        content: "";
        position: absolute;
        top: 3px;
        left: 3px;
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: var(--ink);
        transition: transform 120ms var(--ease);
      }
      .switch input:checked + .switch-ui {
        background: var(--acid);
      }
      .switch input:checked + .switch-ui::after {
        transform: translateX(16px);
      }
      .switch input:focus-visible + .switch-ui {
        box-shadow: var(--focus);
      }
      .switch input:disabled + .switch-ui {
        opacity: 0.45;
      }

      .actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        padding: 12px;
        border-bottom: 1px solid var(--line);
      }

      .btn {
        height: 36px;
        padding: 0 12px;
        border: 1.5px solid var(--ink);
        border-radius: 7px;
        font: 650 13px/1 var(--sans);
        letter-spacing: -0.015em;
        cursor: pointer;
        transition:
          transform 120ms var(--ease),
          box-shadow 120ms var(--ease),
          background 120ms var(--ease);
      }
      .btn:focus-visible {
        box-shadow: var(--focus);
        outline: none;
      }
      .btn:active:not(:disabled) {
        transform: translate(2px, 2px);
        box-shadow: none;
      }
      .btn:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }

      .btn-primary {
        background: var(--acid);
        color: var(--acid-ink);
        box-shadow: var(--block);
      }
      .btn-primary:hover:not(:disabled) {
        background: var(--acid-hover);
      }

      .btn-secondary {
        background: var(--paper);
        color: var(--ink);
        box-shadow: var(--block);
      }
      .btn-secondary:hover:not(:disabled) {
        background: var(--paper-2);
      }

      /* Offline: reconnect owns the row */
      [data-state="disconnected"] .actions,
      [data-state="connecting"] .actions {
        grid-template-columns: 1.4fr 1fr;
      }

      /* ---- footer ---- */
      .foot {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 9px 12px 10px;
        background: var(--paper-bg);
      }

      .foot-link {
        margin: 0;
        padding: 4px 2px;
        border: 0;
        border-radius: 4px;
        background: none;
        color: var(--ink-2);
        font: 600 12px/1 var(--sans);
        cursor: pointer;
        text-decoration: underline;
        text-decoration-color: transparent;
        text-underline-offset: 2px;
      }
      .foot-link:hover {
        color: var(--ink);
        text-decoration-color: currentColor;
      }
      .foot-link:focus-visible {
        box-shadow: var(--focus);
        outline: none;
      }

      .ver {
        font-family: var(--mono);
        font-size: 11px;
        font-weight: 600;
        color: var(--ink-3);
        font-variant-numeric: tabular-nums;
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation: none !important;
          transition: none !important;
        }
      }
    </style>
  </head>
  <body data-state="disconnected">
    <header class="id">
      <button
        class="id-btn"
        id="brand"
        type="button"
        title="Open deeporax.com"
        aria-label="Deeporax, open website"
      >
        <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true">
          <rect
            x="3"
            y="3"
            width="42"
            height="42"
            rx="11"
            fill="#b6e51f"
            stroke="#15170f"
            stroke-width="2.5"
          />
          <rect
            x="19"
            y="19"
            width="15"
            height="15"
            rx="4"
            fill="none"
            stroke="#15170f"
            stroke-width="2.4"
          />
          <rect
            x="13"
            y="13"
            width="17"
            height="17"
            rx="4.5"
            fill="#fdfcf7"
            stroke="#15170f"
            stroke-width="2.7"
          />
          <polygon points="18.6,17 18.6,26 26,21.5" fill="#15170f" />
        </svg>
        <span class="id-name">Deeporax</span>
      </button>
      <span class="id-product">Browser MCP</span>
    </header>

    <section
      class="status"
      aria-labelledby="status-title"
      aria-live="polite"
      aria-atomic="true"
    >
      <p class="status-kicker" id="status-kicker">Bridge</p>
      <h1 class="status-title" id="status-title">Checking connection</h1>
      <p class="status-detail" id="status-detail">Looking for local server</p>
      <p class="hint" id="hint">
        Run <code>npx deeporax-browser-mcp</code>, then open this panel again.
      </p>
    </section>

    <div class="controls">
      <div class="actions">
        <button class="btn btn-primary" id="reconnect" type="button">
          Reconnect
        </button>
        <button class="btn btn-secondary" id="docs" type="button">
          Setup docs
        </button>
      </div>

      <label class="row" for="block-heavy">
        <span class="row-copy">
          <span class="row-title">Block heavy assets</span>
          <span class="row-hint"
            >Skip images, video, and fonts on agent tabs so pages load
            faster.</span
          >
        </span>
        <span class="switch">
          <input
            type="checkbox"
            id="block-heavy"
            role="switch"
            aria-checked="false"
          />
          <span class="switch-ui" aria-hidden="true"></span>
        </span>
      </label>
    </div>

    <footer class="foot">
      <button class="foot-link" id="site" type="button">deeporax.com</button>
      <span class="ver" id="version">v0.1.0</span>
    </footer>

    <script src="popup.js"></script>
  </body>
</html>
