<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Deeporax Browser MCP</title>
    <style>
      /*
        Print-block instrument panel.
        Tokens mirror deeporax.com: greenish ink on warm bone paper, one acid
        accent, hard offset shadows (no blur). System fonts only — CSP blocks
        remote faces, and webfonts are not worth the weight in a 312px panel.
      */
      :root {
        color-scheme: light dark;

        --ink-900: #15170f;
        --ink-600: #565b43;
        --ink-500: #71765c;
        --ink-400: #94987e;
        --paper-0: #fdfcf7;
        --paper-1: #f6f4ea;
        --paper-2: #efecdd;
        --paper-3: #e7e3d0;

        --acid-500: #b6e51f;
        --acid-400: #c9ef4a;
        --acid-ink: #2b3505;
        --acid-wash: #eef8cd;

        --amber-600: #b06c00;
        --amber-wash: #f3e4c2;

        --bg-app: var(--paper-1);
        --surface-card: var(--paper-0);
        --surface-inset: var(--paper-2);
        --text-body: var(--ink-900);
        --text-secondary: var(--ink-600);
        --text-faint: var(--ink-400);
        --text-on-acid: var(--acid-ink);
        --border-hairline: rgba(21, 23, 15, 0.14);
        --border-strong: var(--ink-900);
        --status-warn: var(--amber-600);
        --status-off: var(--ink-500);

        --fx-block: 2px 2px 0 rgba(21, 23, 15, 0.92);
        --fx-block-sm: 1.5px 1.5px 0 rgba(21, 23, 15, 0.92);

        --radius-control: 7px;
        --radius-card: 10px;
        --radius-pill: 999px;

        --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
        --dur-fast: 120ms;
        --dur-med: 200ms;

        --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
          sans-serif;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --ink-900: #f2f1e4;
          --ink-600: #9fa287;
          --ink-500: #8f937a;
          --ink-400: #7f836a;
          --paper-0: #191c10;
          --paper-1: #121408;
          --paper-2: #212416;
          --paper-3: #2a2d1c;
          --acid-wash: #2e3a0b;
          --amber-600: #e3a83f;
          --amber-wash: #382c12;
          --border-hairline: rgba(242, 241, 228, 0.14);
          --fx-block: 2px 2px 0 rgba(0, 0, 0, 0.94);
          --fx-block-sm: 1.5px 1.5px 0 rgba(0, 0, 0, 0.94);
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        width: 312px;
        margin: 0;
        padding: 0;
        background:
          radial-gradient(
            circle at 1px 1px,
            rgba(21, 23, 15, 0.045) 1px,
            transparent 0
          )
          0 0 / 7px 7px,
          var(--bg-app);
        color: var(--text-body);
        font: 400 12.5px/1.4 var(--sans);
        -webkit-font-smoothing: antialiased;
      }

      @media (prefers-color-scheme: dark) {
        body {
          background:
            radial-gradient(
              circle at 1px 1px,
              rgba(242, 241, 228, 0.04) 1px,
              transparent 0
            )
            0 0 / 7px 7px,
            var(--bg-app);
        }
      }

      /* ---------- masthead ---------- */

      header {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 11px 12px 10px;
        border-bottom: 2px solid var(--border-strong);
        background: var(--surface-card);
      }

      .lockup {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        background: none;
        border: 0;
        padding: 2px 4px;
        margin: -2px -4px;
        border-radius: var(--radius-control);
        font: inherit;
        color: inherit;
        cursor: pointer;
        min-width: 0;
      }
      .lockup:focus-visible {
        outline: 2px solid var(--border-strong);
        outline-offset: 1px;
      }
      .lockup svg {
        display: block;
        flex: none;
      }

      .word {
        font-size: 13.5px;
        font-weight: 700;
        letter-spacing: -0.03em;
        white-space: nowrap;
      }

      .badge {
        display: inline-flex;
        align-items: center;
        margin-left: auto;
        padding: 3px 6px 2px;
        border: 1.5px solid var(--border-strong);
        border-radius: 5px;
        background: var(--acid-500);
        color: var(--text-on-acid);
        font-family: var(--mono);
        font-size: 9px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        line-height: 1.2;
        box-shadow: var(--fx-block-sm);
        white-space: nowrap;
      }

      /* ---------- main ---------- */

      main {
        padding: 12px;
        display: grid;
        gap: 10px;
      }

      /* Status ticket — one hard print card. The whole job of the popup. */
      .status {
        position: relative;
        display: grid;
        gap: 8px;
        padding: 11px 12px 12px;
        background: var(--surface-card);
        border: 2px solid var(--border-strong);
        border-radius: var(--radius-card);
        box-shadow: var(--fx-block);
      }

      .status-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }

      .meta {
        font-family: var(--mono);
        font-size: 9.5px;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--text-faint);
      }

      .chip {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        padding: 3px 7px 3px 6px;
        border: 1.5px solid var(--border-strong);
        border-radius: var(--radius-pill);
        background: var(--surface-inset);
        font-family: var(--mono);
        font-size: 9.5px;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--text-secondary);
        line-height: 1.2;
      }
      .chip-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        border: 1.25px solid var(--border-strong);
        background: var(--status-off);
        flex: none;
      }

      [data-state="connected"] .chip {
        background: var(--acid-wash);
        color: var(--text-on-acid);
      }
      [data-state="connected"] .chip-dot {
        background: var(--acid-500);
      }
      [data-state="connecting"] .chip {
        background: var(--amber-wash);
        color: var(--status-warn);
      }
      [data-state="connecting"] .chip-dot {
        background: var(--status-warn);
      }

      .headline {
        margin: 0;
        font-size: 18px;
        font-weight: 750;
        letter-spacing: -0.035em;
        line-height: 1.15;
      }

      .detail {
        margin: 0;
        font-size: 11.5px;
        color: var(--text-secondary);
        line-height: 1.35;
      }

      .endpoint {
        display: inline-block;
        font-family: var(--mono);
        font-size: 11px;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
        letter-spacing: -0.01em;
        color: var(--text-body);
        background: var(--surface-inset);
        border: 1px solid var(--border-hairline);
        border-radius: 4px;
        padding: 2px 6px;
        max-width: 100%;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        vertical-align: bottom;
      }

      /* ---------- preference ---------- */

      .pref {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 9px 10px;
        background: var(--surface-card);
        border: 1.5px solid var(--border-strong);
        border-radius: var(--radius-control);
        box-shadow: var(--fx-block-sm);
        cursor: pointer;
        user-select: none;
      }
      .pref:focus-within {
        outline: 2px solid var(--border-strong);
        outline-offset: 1px;
      }
      .pref-copy {
        min-width: 0;
        flex: 1;
      }
      .pref-title {
        display: block;
        font-size: 12px;
        font-weight: 650;
        letter-spacing: -0.015em;
      }
      .pref-hint {
        display: block;
        margin-top: 2px;
        font-size: 10.5px;
        color: var(--text-secondary);
        line-height: 1.35;
      }

      .switch {
        position: relative;
        flex: none;
        width: 36px;
        height: 20px;
      }
      .switch input {
        position: absolute;
        inset: 0;
        opacity: 0;
        margin: 0;
        cursor: pointer;
      }
      .switch-track {
        display: block;
        width: 100%;
        height: 100%;
        border-radius: 5px;
        background: var(--surface-inset);
        border: 1.5px solid var(--border-strong);
        transition: background var(--dur-fast) var(--ease-out);
        pointer-events: none;
      }
      .switch-track::after {
        content: "";
        position: absolute;
        top: 2px;
        left: 2px;
        width: 14px;
        height: 14px;
        border-radius: 3px;
        background: var(--surface-card);
        border: 1.5px solid var(--border-strong);
        transition: transform var(--dur-fast) var(--ease-out);
      }
      .switch input:checked + .switch-track {
        background: var(--acid-500);
      }
      .switch input:checked + .switch-track::after {
        transform: translateX(16px);
        background: var(--paper-0);
      }
      .switch input:focus-visible + .switch-track {
        outline: 2px solid var(--border-strong);
        outline-offset: 2px;
      }

      /* ---------- actions ---------- */

      .actions {
        display: grid;
        grid-template-columns: 1.35fr 1fr;
        gap: 7px;
      }

      button.act {
        border-radius: var(--radius-control);
        padding: 9px 10px;
        font: 700 12px/1 var(--sans);
        letter-spacing: -0.01em;
        cursor: pointer;
        border: 1.5px solid var(--border-strong);
        transition:
          transform var(--dur-fast) var(--ease-out),
          box-shadow var(--dur-fast) var(--ease-out),
          background var(--dur-fast) var(--ease-out);
      }
      button.act:active {
        transform: translate(1.5px, 1.5px);
        box-shadow: none;
      }
      button.act:focus-visible {
        outline: 2px solid var(--border-strong);
        outline-offset: 2px;
      }

      .primary {
        background: var(--acid-500);
        color: var(--text-on-acid);
        box-shadow: var(--fx-block-sm);
      }
      .primary:hover {
        background: var(--acid-400);
      }

      .ghost {
        background: var(--surface-card);
        color: var(--text-body);
        box-shadow: var(--fx-block-sm);
      }
      .ghost:hover {
        background: var(--surface-inset);
      }

      /* ---------- help strip ---------- */

      .help {
        margin: 0;
        padding: 8px 10px;
        border-radius: var(--radius-control);
        background: var(--surface-inset);
        border: 1.5px dashed var(--border-hairline);
        font-size: 11px;
        color: var(--text-secondary);
      }
      .help p {
        margin: 0;
      }
      .help code {
        font-family: var(--mono);
        font-size: 10px;
        font-weight: 600;
        padding: 1px 4px;
        border-radius: 3px;
        background: var(--surface-card);
        border: 1px solid var(--border-hairline);
        color: var(--text-body);
      }

      /* ---------- footer ---------- */

      footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 8px 12px 10px;
        border-top: 1.5px solid var(--border-hairline);
        background: var(--surface-card);
      }

      .link {
        background: none;
        border: 0;
        padding: 2px 4px;
        margin: -2px -4px;
        border-radius: var(--radius-control);
        font: 600 11px/1 var(--sans);
        color: var(--text-faint);
        cursor: pointer;
      }
      .link:hover {
        color: var(--text-body);
      }
      .link:focus-visible {
        outline: 2px solid var(--border-strong);
        outline-offset: 1px;
      }

      .version {
        font-family: var(--mono);
        font-size: 10px;
        font-weight: 600;
        color: var(--text-faint);
        font-variant-numeric: tabular-nums;
        letter-spacing: 0.02em;
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::after {
          animation: none !important;
          transition: none !important;
        }
      }
    </style>
  </head>
  <body data-state="disconnected">
    <header>
      <button class="lockup" id="brand" type="button" title="Open deeporax.com">
        <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true">
          <rect
            x="3"
            y="3"
            width="42"
            height="42"
            rx="11"
            fill="#b6e51f"
            stroke="#15170f"
            stroke-width="2.5"
          />
          <rect
            x="19"
            y="19"
            width="15"
            height="15"
            rx="4"
            fill="none"
            stroke="#15170f"
            stroke-width="2.4"
          />
          <rect
            x="13"
            y="13"
            width="17"
            height="17"
            rx="4.5"
            fill="#fdfcf7"
            stroke="#15170f"
            stroke-width="2.7"
          />
          <polygon points="18.6,17 18.6,26 26,21.5" fill="#15170f" />
        </svg>
        <span class="word">Deeporax</span>
      </button>
      <span class="badge">MCP</span>
    </header>

    <main>
      <section class="status" aria-live="polite">
        <div class="status-top">
          <span class="meta">Bridge</span>
          <span class="chip" id="chip">
            <span class="chip-dot" aria-hidden="true"></span>
            <span id="chip-text">Offline</span>
          </span>
        </div>
        <h1 class="headline" id="headline">Checking…</h1>
        <p class="detail" id="detail">Looking for local server</p>
      </section>

      <label class="pref" for="block-heavy">
        <span class="pref-copy">
          <span class="pref-title">Block heavy assets</span>
          <span class="pref-hint">
            Skip images, video, and fonts on agent tabs.
          </span>
        </span>
        <span class="switch">
          <input
            type="checkbox"
            id="block-heavy"
            role="switch"
            aria-checked="false"
          />
          <span class="switch-track" aria-hidden="true"></span>
        </span>
      </label>

      <div class="actions">
        <button class="act primary" id="reconnect" type="button">
          Reconnect
        </button>
        <button class="act ghost" id="docs" type="button">Setup</button>
      </div>

      <div class="help">
        <p id="help-text">
          Run <code>npx deeporax-browser-mcp</code>, then reopen this popup.
        </p>
      </div>
    </main>

    <footer>
      <button class="link" id="site" type="button">deeporax.com</button>
      <span class="version" id="version">v0.1.0</span>
    </footer>

    <script src="popup.js"></script>
  </body>
</html>
